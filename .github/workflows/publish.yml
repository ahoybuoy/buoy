name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref containing the package versions to publish
        required: true
        default: v0.4.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean package build output
        run: |
          pnpm --filter @buoy-design/core clean
          pnpm --filter @buoy-design/scanners clean
          pnpm --filter @buoy-design/cli clean

      - name: Build
        run: pnpm build

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail

          publish_package() {
            local package_dir="$1"
            local package_name
            local package_version
            local pack_dir
            local pack_output
            local tarball_path
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping"
              return
            fi

            echo "Publishing ${package_name}@${package_version}"
            pack_dir="${RUNNER_TEMP}/buoy-npm-packages"
            mkdir -p "${pack_dir}"
            pack_output="$(pnpm --dir "${package_dir}" pack --pack-destination "${pack_dir}")"
            tarball_path="$(printf '%s\n' "${pack_output}" | tail -n 1)"

            if tar -xOf "${tarball_path}" package/package.json | grep -q 'workspace:'; then
              echo "Refusing to publish ${package_name}: unresolved workspace dependency"
              exit 1
            fi

            npm publish "${tarball_path}" --access public
          }

          publish_package packages/core
          publish_package packages/scanners
          publish_package apps/cli
          publish_package packages/ahoybuoy
          publish_package packages/buoy-design

      - name: Verify published versions
        shell: bash
        run: |
          set -euo pipefail

          verify_package() {
            local package_dir="$1"
            local package_name
            local expected_version
            local published_version=""
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            expected_version="$(node -p "require('./${package_dir}/package.json').version")"

            for attempt in {1..12}; do
              published_version="$(npm view "${package_name}@${expected_version}" version 2>/dev/null || true)"
              if [ "${published_version}" = "${expected_version}" ]; then
                echo "Verified ${package_name}@${published_version}"
                return
              fi
              echo "Waiting for ${package_name}@${expected_version} to propagate (${attempt}/12)"
              sleep 5
            done

            echo "Registry verification failed for ${package_name}@${expected_version}"
            exit 1
          }

          for package_dir in \
            packages/core \
            packages/scanners \
            apps/cli \
            packages/ahoybuoy \
            packages/buoy-design; do
            verify_package "${package_dir}"
          done

      - name: Smoke test public CLI aliases
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(node -p "require('./package.json').version")"
          smoke_dir="$(mktemp -d)"
          cd "${smoke_dir}"
          npm init --yes >/dev/null
          npm install "ahoybuoy@${release_version}" "buoy-design@${release_version}" --ignore-scripts
          test "$(npx --no-install ahoybuoy --version)" = "${release_version}"
          test "$(npx --no-install buoy-design --version)" = "${release_version}"
